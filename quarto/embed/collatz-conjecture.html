<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://chrismayfield.github.io/ThinkJava2/assets/javarunner/javarunner.css">
  <style>
    html, body { margin: 0; padding: 8px; }
    /* Light console to match the editor (embed-only override). */
    :root {
      --jr-console-bg: #ffffff;
      --jr-console-text: #1a1a1a;
      --jr-console-input: #005a9e;
      --jr-console-error: #c62828;
      --jr-console-separator: #e0e0e0;
      --jr-input-bg: #f8f9fa;
      --jr-input-border: #d0d0d0;
    }
    .jr-repl, .jr-console { color-scheme: light; }
    .jr-repl-input-line {
      background: var(--jr-console-bg);
      border-top: 1px solid var(--jr-console-separator);
    }
    .jr-repl-input, .jr-console-input-field {
      background-color: var(--jr-input-bg) !important;
      color: var(--jr-console-text) !important;
      caret-color: var(--jr-console-text);
      -webkit-text-fill-color: var(--jr-console-text);
    }
    .jr-repl-echo { color: var(--jr-console-text); }
    .jr-editor .cm-activeLine { background-color: rgba(204, 238, 255, 0.27) !important; }
    .jr-editor .cm-activeLineGutter { background-color: #e2f2ff !important; }
    .jr-pending-code {
      background-color: #f8f9fa;
      padding: 0.5em 0.75em;
      border-radius: 3px;
      border: 1px solid #e0e0e0;
      font-size: 0.95em;
      overflow-x: auto;
      margin: 0 0 0.5em 0;
    }
    .jr-pending:has(.jr-widget) > .jr-pending-code { display: none; }
    .jr-btn-test { display: none !important; }
  </style>
</head>
<body>
<div class="jr-pending">
<pre class="jr-pending-code"><code>int n = 3;
while (n != 1) {
    System.out.println(n);
    if (n % 2 == 0) {         // n is even
        n = n / 2;
    } else {                  // n is odd
        n = 3 * n + 1;
    }
}</code></pre>
<script type="text/x-java">
int n = 3;
while (n != 1) {
    System.out.println(n);
    if (n % 2 == 0) {         // n is even
        n = n / 2;
    } else {                  // n is odd
        n = 3 * n + 1;
    }
}
</script>
</div>
<script defer src="https://chrismayfield.github.io/ThinkJava2/assets/javarunner/javarunner.js"></script>
</body>
</html>
